services:
  hermes:
    image: nousresearch/hermes-agent
    container_name: hermes
    command: gateway run
    environment:
      - TZ=Europe/Paris
      - HERMES_TIMEZONE=Europe/Paris
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      - API_SERVER_CORS_ORIGINS=*
      - BROWSER_CDP_URL=http://hermes-browser:9223
      - OBSIDIAN_VAULT_PATH=/opt/storage/knowledges
    volumes:
      - hermes-agent-src:/opt/hermes
      - ./hermes-data:/opt/data
      - ./storage-data:/opt/storage
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
    networks:
      - hermes-internal
    depends_on:
      - hermes-browser
    restart: unless-stopped

  hermes-browser:
    image: lscr.io/linuxserver/chromium
    container_name: hermes-browser
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - CUSTOM_USER=admin
      - PASSWORD=${HERMES_WEBUI_PASSWORD}
      - TITLE=Hermes Browser
      - RESTART_APP=true
      - CHROME_CLI=--remote-debugging-port=9222 --remote-allow-origins=* --user-data-dir=/config/chrome-debug --no-first-run --no-default-browser-check --disable-dev-shm-usage
    volumes:
      - ./browser/data:/config
      - ./browser/init:/custom-cont-init.d:ro
      - ./browser/services:/custom-services.d:ro
    expose:
      - "9222"
      - "9223"
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2.0"
    networks:
      - hermes-internal
      - web
    restart: unless-stopped

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui
    container_name: hermes-webui
    environment:
      - TZ=Europe/Paris
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
      - HERMES_WEBUI_STATE_DIR=/opt/webui
      - HERMES_WEBUI_AGENT_DIR=/opt/hermes
      - HERMES_WEBUI_DEFAULT_WORKSPACE=/opt/storage
      - HERMES_HOME=/opt/data
    volumes:
      - hermes-agent-src:/opt/hermes
      - ./hermes-data:/opt/data
      - ./storage-data:/opt/storage
      - ./webui-data:/opt/webui
    networks:
      - hermes-internal
      - web
    depends_on:
      - hermes
    restart: unless-stopped
 
  hermes-silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet
    container_name: hermes-silverbullet
    environment:
      - PUID=10000
      - PGID=10000
      - SB_USER=${SB_USER}
    volumes:
      - ./storage-data/knowledges:/space
    networks:
      - hermes-internal
      - web
    restart: unless-stopped

volumes:
  hermes-agent-src:

networks:
  hermes-internal:
  web:
    external: true
