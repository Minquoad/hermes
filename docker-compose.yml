services:
  agent:
    image: nousresearch/hermes-agent
    container_name: ${COMPOSE_PROJECT_NAME}-agent
    command: gateway run
    environment:
      - TZ=Europe/Paris
      - HERMES_TIMEZONE=Europe/Paris
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      - API_SERVER_CORS_ORIGINS=*
      - BROWSER_CDP_URL=http://browser:9223
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/opt/storage:/tmp
      - OBSIDIAN_VAULT_PATH=/opt/storage/knowledges
    volumes:
      - agent-src:/opt/hermes
      - ./agent-data:/opt/data
      - ./storage-data:/opt/storage
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
    depends_on:
      - browser
    restart: unless-stopped

  webui:
    image: ghcr.io/nesquena/hermes-webui
    container_name: ${COMPOSE_PROJECT_NAME}-webui
    environment:
      - TZ=Europe/Paris
      - HERMES_NIX_BUILD=1
      - HERMES_API_URL=http://agent:8642
      - HERMES_HOME=/opt/data
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
      - HERMES_WEBUI_CHAT_BACKEND=gateway
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_GATEWAY_USE_RUNS_API=true
      - HERMES_WEBUI_GATEWAY_BASE_URL=http://agent:8642
      - HERMES_WEBUI_GATEWAY_API_KEY=${API_SERVER_KEY}
      - HERMES_WEBUI_STATE_DIR=/opt/webui
      - HERMES_WEBUI_AGENT_DIR=/opt/hermes
      - HERMES_WEBUI_DEFAULT_WORKSPACE=/opt/storage
    volumes:
      - agent-src:/opt/hermes:ro
      - ./agent-data:/opt/data
      - ./storage-data:/opt/storage
      - ./webui-data:/opt/webui
    networks:
      - default
      - web
    depends_on:
      - agent
    restart: unless-stopped
 
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet
    container_name: ${COMPOSE_PROJECT_NAME}-silverbullet
    environment:
      - PUID=10000
      - PGID=10000
      - SB_USER=${SB_USER}
    volumes:
      - ./storage-data/knowledges:/space
    networks:
      - default
      - web
    restart: unless-stopped

  browser:
    image: lscr.io/linuxserver/chromium
    container_name: ${COMPOSE_PROJECT_NAME}-browser
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - CUSTOM_USER=admin
      - PASSWORD=${HERMES_WEBUI_PASSWORD}
      - TITLE=Hermes Browser
      - RESTART_APP=true
      - >-
        CHROME_CLI=--remote-debugging-port=9222
        --remote-allow-origins=*
        --user-data-dir=/config/chrome-debug
        --no-first-run
        --no-default-browser-check
        --disable-dev-shm-usage
    volumes:
      - ./browser/data:/config
      - ./browser/init:/custom-cont-init.d:ro
      - ./browser/services:/custom-services.d:ro
    expose:
      - "9222"
      - "9223"
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2.0"
    networks:
      - default
      - web
    restart: unless-stopped

volumes:
  agent-src:

networks:
  web:
    external: true
